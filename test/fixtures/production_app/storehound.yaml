# What a team records once and keeps in review: no rule is disabled and no
# finding is ignored.
fail_on: info

rules:
  background-modes-justified:
    allow:
      audio: >-
        Open any product with an audio guide, press play and lock the device:
        the guide keeps playing with lock-screen controls.
      remote-notification: >-
        Silent pushes refresh the status of an order in the Orders tab, for
        example when a parcel is handed to the courier.
  purpose-string-missing:
    linked_by_plugin:
      # The card SDK bundled by our acme_payments package references
      # CoreLocation (seen with nm -u on a release build); the app never
      # requests location.
      acme_payments: [NSLocationWhenInUseUsageDescription]

# Pins this app keeps on top of the built-in rules.
checks:
  encryption-exempt:
    file: info_plist
    key: ITSAppUsesNonExemptEncryption
    equals: false
    reason: Export compliance is answered once in App Store Connect.
  background-modes-pinned:
    file: info_plist
    key: UIBackgroundModes
    equals: [audio, remote-notification]
    reason: The modes App Review accepted. A new one needs review notes first.
  ats-no-arbitrary-loads:
    file: info_plist
    key: NSAppTransportSecurity.NSAllowsArbitraryLoads
    absent_or_equals: false
    reason: All traffic is HTTPS.
  no-backup:
    file: android_manifest
    element: application
    attribute: android:allowBackup
    equals: "false"
    reason: The session token lives in shared preferences.
  no-media-permissions:
    file: android_manifest
    element: uses-permission
    attribute: android:name
    none_of:
      - android.permission.READ_MEDIA_IMAGES
      - android.permission.READ_MEDIA_VIDEO
    reason: Receipts come through the system document picker, which needs no permission.
