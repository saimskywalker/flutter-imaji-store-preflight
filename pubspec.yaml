name: storehound
description: >-
  Catch App Store and Google Play rejections in your Flutter project before
  review. A Dart CLI that lints Info.plist, privacy manifests, entitlements and
  AndroidManifest in CI.
version: 0.3.0
repository: https://github.com/saimskywalker/storehound
issue_tracker: https://github.com/saimskywalker/storehound/issues
topics:
  - flutter
  - ios
  - android
  - app-store
  - ci

environment:
  sdk: ^3.8.0

executables:
  storehound:
  # The pre-rename command name, kept for 0.2.x only.
  imaji_store_preflight: storehound

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  xml: '>=6.6.1 <8.0.0'
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
