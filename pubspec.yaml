name: imaji_store_preflight
description: >-
  Catch App Store and Google Play rejections in your Flutter project before
  review. A Dart CLI that lints Info.plist, privacy manifests, entitlements and
  AndroidManifest in CI.
version: 0.1.2
repository: https://github.com/saimskywalker/flutter-imaji-store-preflight
issue_tracker: https://github.com/saimskywalker/flutter-imaji-store-preflight/issues
topics:
  - flutter
  - ios
  - android
  - app-store
  - ci

environment:
  sdk: ^3.8.0

executables:
  imaji_store_preflight:

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  xml: '>=6.6.1 <8.0.0'
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
